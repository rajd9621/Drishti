services:
  - type: web
    name: drishti
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DRISHTI_ENABLE_SLM
        value: "0"                 # set "1" only if the host has RAM for the model
      - key: DRISHTI_MODEL_ID
        value: Qwen/Qwen2.5-1.5B-Instruct
      - key: DRISHTI_CACHE_TTL
        value: "1800"
      - key: DRISHTI_DEFAULT_RADIUS_KM
        value: "5"
      # Add these secrets in Render Dashboard > Environment.
      # Keep sync:false so credentials are never committed to this repository.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_TLS
        value: "1"
      # Optional official overlays - add these as secret env vars in the dashboard,
      # never commit real values.
      # - key: WAQI_TOKEN
      #   sync: false
      # - key: IMD_API_KEY
      #   sync: false
      # - key: IMD_JWT
      #   sync: false
